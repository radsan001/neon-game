<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ff00ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#2a004f" stop-opacity="1" />
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#0d001a" />
  <polygon points="256,50 450,200 380,450 132,450 62,200" fill="url(#glow)" filter="url(#neon)" stroke="#00ffff" stroke-width="15" stroke-linejoin="round" />
  <polygon points="256,120 380,230 330,400 182,400 132,230" fill="rgba(0, 255, 255, 0.4)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
</svg>
